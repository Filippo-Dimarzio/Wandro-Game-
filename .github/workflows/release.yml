name: Release

# Publishes a GitHub Release with notes from docs/releases/<tag>.md.
# Either push a tag like v1.0.0, or run this workflow manually with the tag name;
# the manual run creates the tag on the selected branch's latest commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.0.0 (needs docs/releases/<tag>.md)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Wandro ${{ env.TAG }}
          body_path: docs/releases/${{ env.TAG }}.md
          make_latest: true
