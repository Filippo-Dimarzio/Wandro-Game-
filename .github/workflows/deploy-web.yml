name: Deploy web app

# Builds the Expo web app (demo mode) and publishes it to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_BASE_URL: /${{ github.event.repository.name }}
      EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}
      # Where /join sends beta sign-ups: Settings -> Secrets and variables -> Actions -> Variables.
      EXPO_PUBLIC_WAITLIST_URL: ${{ vars.WAITLIST_URL }}
      EXPO_NO_TELEMETRY: 1
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mobile build:web
      # Single-page app: serve index.html for deep links too.
      - run: cp apps/mobile/dist/index.html apps/mobile/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
