    </pattern>
    <pattern id="grassH" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#4E5A26" stroke-width="1.2" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="500" height="560" fill="url(#sky)"/>
