    <path d="M64 256h28v164H64z" fill="#7FA3C2"/><path d="M92 244h32v176H92z" fill="#E7DCC2"/>
    <path d="M124 262h28v158h-28z" fill="#D9574A"/><path d="M152 272h26v148h-26z" fill="#9CC28A"/>
    <path d="M0 250l17-14l17 14M34 236l15-12l15 12M64 256l14-12l14 12M92 244l16-12l16 12M124 262l14-12l14 12M152 272l13-10l13 10" fill="#8A3A2A"/>
    <path d="M14 200h40v50H14z" fill="#F2C14E"/><path d="M60 190h44v54H60z" fill="#E7DCC2"/><path d="M110 206h40v56h-40z" fill="#7FA3C2"/>
