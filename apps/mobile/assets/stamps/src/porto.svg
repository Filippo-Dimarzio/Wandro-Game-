    <rect x="70" y="276" width="7" height="12"/><rect x="80" y="276" width="7" height="12"/><rect x="100" y="264" width="7" height="12"/><rect x="112" y="264" width="7" height="12"/>
    <rect x="8" y="310" width="8" height="12"/><rect x="20" y="310" width="8" height="12"/><rect x="42" y="300" width="7" height="12"/><rect x="52" y="300" width="7" height="12"/>
    <rect x="132" y="284" width="7" height="12"/><rect x="160" y="292" width="7" height="12"/><rect x="100" y="304" width="7" height="12"/><rect x="112" y="304" width="7" height="12"/>
