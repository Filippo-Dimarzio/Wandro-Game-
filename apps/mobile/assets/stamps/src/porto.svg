    <path d="M60 176v244M76 176v244M424 176v244M440 176v244" stroke-width="3"/>
    <path d="M60 210h16M60 260h16M60 310h16M60 360h16M424 210h16M424 260h16M424 310h16M424 360h16" stroke-width="1.6"/>
