    <path d="M98 420C150 140 350 140 402 420" stroke-width="3"/>
    <path d="M80 374L107 380M107 380L93 334M93 334L118 344M118 344L108 298M108 298L130 313M130 313L125 266M125 266L145 286M145 286L143 240M143 240L160 262M160 262L163 218M163 218L177 244M177 244L184 202M184 202L194 229M194 229L205 190M205 190L212 218M212 218L228 182M228 182L231 212M231 212L250 180M250 180L250 210M250 210L272 182M272 182L269 212M269 212L295 190M295 190L288 218M288 218L316 202M316 202L306 229M306 229L337 218M337 218L323 244M323 244L357 240M357 240L340 262M340 262L375 266M375 266L355 286M355 286L392 298M392 298L370 313M370 313L407 334M407 334L382 344M382 344L420 374M420 374L393 380" stroke-width="1.5"/>
    <path d="M110 176V294M140 176V244M170 176V212M330 176V212M360 176V244M390 176V294" stroke-width="2"/>
