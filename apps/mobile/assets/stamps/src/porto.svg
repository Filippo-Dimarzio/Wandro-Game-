  <g stroke="#3B0F18" stroke-width="2" stroke-linejoin="round">
    <path d="M150 470h170q-10 28-40 30H190q-30-2-40-30z" fill="#8A5A2B"/>
    <path d="M150 470q-14-18-6-34M320 470q10-12 8-28" fill="none"/>
    <path d="M236 470v-86" />
    <path d="M236 388h52v58h-52z" fill="#F7F1E1"/>
    <g fill="#6E3A1E"><ellipse cx="190" cy="462" rx="12" ry="9"/><ellipse cx="214" cy="462" rx="12" ry="9"/><ellipse cx="270" cy="462" rx="12" ry="9"/></g>
  </g>
  <rect x="10" y="10" width="480" height="540" fill="none" stroke="#6E1E2E" stroke-width="4"/>
  <rect x="20" y="20" width="460" height="520" fill="none" stroke="#6E1E2E" stroke-width="1.5"/>
</svg>
