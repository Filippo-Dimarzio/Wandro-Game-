  <path d="M330 150C380 140 440 150 500 160V420H330Z" fill="url(#hatch)"/>
  <path d="M410 150c0-24 18-34 30-34s30 10 30 34z" fill="#E7DCC2" stroke="#6E1E2E" stroke-width="2"/>
  <path d="M0 170C60 160 120 168 170 176V420H0Z" fill="#B88A6A"/>
