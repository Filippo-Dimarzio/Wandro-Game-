    <rect x="268" y="154" width="10" height="6" fill="#F8E4C8"/><rect x="284" y="154" width="10" height="6" fill="#F8E4C8"/><rect x="300" y="154" width="10" height="6" fill="#F8E4C8"/><rect x="316" y="154" width="10" height="6" fill="#F8E4C8"/>
