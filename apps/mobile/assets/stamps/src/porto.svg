<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="500" height="560">
  <!-- Dom Luís I Bridge over the Douro, Porto: vintage engraved stamp style. Ink: wine. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3C9A6"/>
      <stop offset="0.6" stop-color="#F8E4C8"/>
      <stop offset="1" stop-color="#F4E7CC"/>
    </linearGradient>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#6E1E2E" stroke-width="1.1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="500" height="560" fill="url(#sky)"/>
  <g transform="translate(250 330)" fill="#E8964A" opacity="0.22">
    <path d="M0 0L-26 -330L26 -330Z"/><path d="M0 0L-26 -330L26 -330Z" transform="rotate(20)"/>
    <path d="M0 0L-26 -330L26 -330Z" transform="rotate(40)"/><path d="M0 0L-26 -330L26 -330Z" transform="rotate(60)"/>
    <path d="M0 0L-26 -330L26 -330Z" transform="rotate(-20)"/><path d="M0 0L-26 -330L26 -330Z" transform="rotate(-40)"/>
    <path d="M0 0L-26 -330L26 -330Z" transform="rotate(-60)"/>
  </g>
