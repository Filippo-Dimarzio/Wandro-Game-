# Supabase CLI config for local development (`supabase start`). The hosted project's Auth
# settings (site URL, redirect URLs, email templates, SMTP) live in its dashboard; see
# docs/supabase-setup.md. Values here mirror them so local behaves the same.
project_id = "wandro"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[auth]
enabled = true
site_url = "https://filippo-dimarzio.github.io/Wandro-Game-"
additional_redirect_urls = [
  "https://filippo-dimarzio.github.io/Wandro-Game-/**",
  "wandro://**",
  "http://localhost:8081/**",
]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "60s"

[auth.email.template.recovery]
subject = "Reset your Wandro password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.confirmation]
subject = "Confirm your Wandro account"
content_path = "./supabase/templates/confirmation.html"
